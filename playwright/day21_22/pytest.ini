[pytest]
addopts = -v --reruns 2 --reruns-delay 5 --alluredir=reports/allure-results
markers =
    smoke: quick high-priority tests
    regression: full coverage tests
    flaky: tests that may fail intermittently
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
filterwarnings =
    ignore::pytest.PytestUnraisableExceptionWarning
    ignore::RuntimeWarning
